[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad2ems-fem"
dynamic = ["version"]
description = "kicad2ems's finite-element solvers: the board meshed by gmsh, solved by Palace (S-parameters) or Elmer (DC IR drop)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{ name = "Claude", email = "noreply@anthropic.com" }]
dependencies = [
    "kicad2ems>=261028.post1",     # kicad2ems.api.solver 2.1
    "numpy>=1.24",
    "shapely>=2.0",
    "gmsh>=4.11",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."kicad2ems.solvers"]
palace = "kicad2ems_fem.palace.plugin:Palace"

[project.scripts]
kicad2ems-fem-dc = "kicad2ems_fem.elmer.dc:main"

[tool.setuptools.dynamic]
version = {attr = "kicad2ems_fem.__version__"}
